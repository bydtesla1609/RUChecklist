<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业导入设置</title><link rel="stylesheet" href="options.css"><script src="options.js" defer></script></head>
<body><h1>连接大学任务看板</h1><p>配对后，读取 Edge 已登录页面中的作业标题、课程和截止时间。不会上传账号密码、Cookie、答案或成绩。</p>
<form id="settings"><label for="url">看板地址</label><input id="url" type="url" placeholder="https://你的看板地址" required><label for="token">配对码</label><input id="token" type="password" required autocomplete="off"><p>在看板 → 作业来源与同步 → 生成扩展配对码。</p><details><summary>自定义作业页（选填）</summary><p>填写自己登录后的作业列表地址，留空则打开平台首页。</p><label for="smartestu">SmartEstu</label><input id="smartestu" type="url" placeholder="https://smartestu.cn/assignment"><label for="ketangpai">课堂派课程页</label><input id="ketangpai" type="url" placeholder="https://www.ketangpai.com/…"><label for="chaoxing">学习通课程页</label><input id="chaoxing" type="url" placeholder="https://mooc2-ans.chaoxing.com/…"></details><label class="check"><input id="enabled" type="checkbox">每 15 分钟自动检查</label><p>会创建三个专用标签页。请在这些标签页登录并打开作业栏目。电脑休眠或 Edge 关闭后暂停采集；只导入已加载的列表内容。学习通适配器尚待验证。</p><button type="submit">保存设置</button><button id="scan" type="button">立即打开作业页</button></form><p id="result" role="status"></p></body></html>
